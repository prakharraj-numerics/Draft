name: SINE53 materialize Taylor experiment

on:
  push:
    branches:
      - experiment/sine53-taylor-architecture
    paths:
      - tools/taylorize_sine53_experiment.py
      - .github/workflows/sine53-taylor-materialize-experiment.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: experiment/sine53-taylor-architecture
          fetch-depth: 0

      - name: Install direct local Taylor hot path
        run: python3 tools/taylorize_sine53_experiment.py

      - name: Correct inherited evaluator comment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = '''/* Xeon v11: instruction-level realization of the same degree-5 Mode-5
             evaluator. The profile is fixed at terms=2/degree=5 for binary64, so expose
             that fact to icx: direct nearest conversion gives the gather index, the
             aligned plane-major table is retained, and Horner is explicitly unrolled.
             Numerical FMA order is identical to v8. */'''
          new = '''/* Experimental Taylor hot path: preserve the same 1/256 anchor lookup
             and degree-5 local polynomial, but evaluate the even/odd Taylor pieces as
             two independent quadratics in d^2 instead of one serial Horner chain. */'''
          for name in ('sine53_x50_unit_production.c', 'sine53_x67_wide_production.c'):
              p = Path(name)
              s = p.read_text()
              if old in s:
                  p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify experiment is narrowly scoped
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if [ -n "$changed" ]; then
            test "$changed" = $'sine53_x50_unit_production.c\nsine53_x67_wide_production.c' || {
              echo "Unexpected changed-file set" >&2
              exit 1
            }
          fi
          grep -q 'taylor_poly_x11' sine53_x50_unit_production.c
          grep -q 'taylor_poly_low_x11' sine53_x50_unit_production.c
          grep -q 'taylor_poly_x11' sine53_x67_wide_production.c
          grep -q 'taylor_poly_low_x11' sine53_x67_wide_production.c
          ! grep -q 'Horner is explicitly unrolled' sine53_x50_unit_production.c
          ! grep -q 'Horner is explicitly unrolled' sine53_x67_wide_production.c

      - name: Commit materialized experimental sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Taylor experiment already materialized; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sine53_x50_unit_production.c sine53_x67_wide_production.c
          git commit -m 'Experiment: finalize factored local Taylor hot path comments'
          git push origin HEAD:experiment/sine53-taylor-architecture
