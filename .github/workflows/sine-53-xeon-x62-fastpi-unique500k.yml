name: Sine 53-bit X62 nearest-pi unique500k

on:
  workflow_dispatch:
  push:
    branches: [ sine53-xeon-tuned-v2 ]
    paths:
      - 'make_sine_53_xeon_x62_fastpi.py'
      - 'inject_sine53_unique9600_bands500k.py'
      - '.github/workflows/sine-53-xeon-x62-fastpi-unique500k.yml'

env:
  FLINT_PREFIX: /home/runner/flint36

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        slot: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Detect Intel Xeon AVX-512 host
        id: cpu
        shell: bash
        run: |
          MODEL="$(lscpu | awk -F: '/Model name/{gsub(/^[ \t]+/,"",$2); print $2; exit}')"
          lscpu | grep -E 'Vendor ID|Model name|CPU\(s\)|L2 cache|L3 cache'
          echo "detected_model=$MODEL"
          if [[ "$MODEL" == *"Intel"*"Xeon"* ]] && grep -m1 '^flags' /proc/cpuinfo | grep -qw avx512f; then echo eligible=1 >> "$GITHUB_OUTPUT"; else echo eligible=0 >> "$GITHUB_OUTPUT"; echo "SKIP: requires Intel Xeon AVX-512F"; fi
      - uses: actions/cache@v4
        if: steps.cpu.outputs.eligible == '1'
        with:
          path: /opt/intel/oneapi
          key: intel-oneapi-prof3-intel-2026.1.0-236-2026.1.1-325-v1
      - name: Base packages
        if: steps.cpu.outputs.eligible == '1'
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential binutils libgmp-dev libmpfr-dev
      - uses: actions/cache@v4
        if: steps.cpu.outputs.eligible == '1'
        with:
          path: /home/runner/flint36
          key: flint-3.6.0-ubuntu24-x86_64-native-cd49f6116fb977da331dbb6627f4998397730a62253bd7a70a201ad5a00576d7-v2
      - name: Generate X50 baseline and X62 reducer-only candidate
        if: steps.cpu.outputs.eligible == '1'
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^int main(void){int cpu=pin();mkl_set_num_threads_local(1);printf("S53F2_DOMAIN/int s53f2_disabled_main(void){int cpu=pin();mkl_set_num_threads_local(1);printf("S53F2_DOMAIN/' bench_sine_53_wide_fast2.c
          sed -i 's/#define SF_K 12/#define SF_K 8/' sine_53_coeff_source.c
          sed -i 's/#define SF_LUT_N ((1UL << SF_K) + 1UL)/#define SF_LUT_N 403UL/' sine_53_coeff_source.c
          sed -i 's/#define KGRID 4096.0/#define KGRID 256.0/' bench_sine_53_wide_intel.c
          sed -i 's|#define INVK (1.0/4096.0)|#define INVK (1.0/256.0)|' bench_sine_53_wide_intel.c
          python3 make_sine_53_xeon_x50_x53_hw_campaign.py
          cp bench_sine_53_xeon_x50_build.c /tmp/x50.c
          python3 make_sine_53_xeon_x62_fastpi.py
          cp bench_sine_53_xeon_x62_build.c /tmp/x62.c
      - name: Compile same-run Arb-gated benchmarks
        if: steps.cpu.outputs.eligible == '1'
        shell: bash
        run: |
          set -euo pipefail
          MKLROOT=/opt/intel/oneapi/mkl/latest; CC=/opt/intel/oneapi/compiler/latest/bin/icx
          INC="-DNDEBUG -I$FLINT_PREFIX/include -I$MKLROOT/include -I."
          LIBS="-L$FLINT_PREFIX/lib -Wl,-rpath,$FLINT_PREFIX/lib -lflint -lmpfr -lgmp -L$MKLROOT/lib -Wl,-rpath,$MKLROOT/lib -Wl,--no-as-needed -lmkl_intel_lp64 -lmkl_sequential -lmkl_core -lpthread -lm -ldl"
          mkdir -p /tmp/x62fastpi
          for v in x50 x62; do
            cp /tmp/${v}.c /tmp/${v}_bands.c
            python3 inject_sine53_unique9600_bands500k.py /tmp/${v}_bands.c
            "$CC" -O3 -xHost -fp-model=precise $INC /tmp/${v}_bands.c -o /tmp/${v}_bands $LIBS
            objdump -drwC -Mintel --disassemble=octant_vector_v8 /tmp/${v}_bands > /tmp/x62fastpi/${v}.hot.objdump || true
          done
      - name: Run X50 and X62 against Intel VML_HA
        if: steps.cpu.outputs.eligible == '1'
        shell: bash
        run: |
          set +e
          MKLROOT=/opt/intel/oneapi/mkl/latest
          export LD_LIBRARY_PATH="$FLINT_PREFIX/lib:$MKLROOT/lib:${LD_LIBRARY_PATH:-}"
          echo "CPU=$(lscpu | awk -F: '/Model name/{gsub(/^[ \t]+/,"",$2);print $2;exit}')" | tee /tmp/x62fastpi/results.txt
          echo "OBJECTIVE=9600_unique split=3200_each ranges=abs_lt_1,abs_1_to_500,abs_1000_to_500000 report=min_median_max trials=7 evals_per_trial_per_band=30000000 comparator=oneMKL_vmdSin_VML_HA" | tee -a /tmp/x62fastpi/results.txt
          echo "X62_CHANGE=reducer_only nearest_pi=round(abs(x)/pi) common=FMA_pi_hi_plus_pi_lo near_zero=compensated_3piece_pi parity_sign=XOR Mode5=unchanged LUT=unchanged Horner=unchanged X50_schedule=unchanged" | tee -a /tmp/x62fastpi/results.txt
          for v in x50 x62; do
            echo "=== ${v} ===" | tee -a /tmp/x62fastpi/results.txt
            stdbuf -oL -eL /tmp/${v}_bands 2>&1 | tee -a /tmp/x62fastpi/results.txt
            echo "RC_${v}=${PIPESTATUS[0]}" | tee -a /tmp/x62fastpi/results.txt
          done
          exit 0
      - name: Reducer machine-code census
        if: steps.cpu.outputs.eligible == '1'
        shell: bash
        run: |
          set +e
          : > /tmp/x62fastpi/machine.txt
          for v in x50 x62; do
            f=/tmp/x62fastpi/${v}.hot.objdump; [ -f "$f" ] || continue
            echo "=== $v ===" | tee -a /tmp/x62fastpi/machine.txt
            printf 'gathers=' | tee -a /tmp/x62fastpi/machine.txt; grep -Eic 'vgather(d|q)?pd' "$f" | tee -a /tmp/x62fastpi/machine.txt
            printf 'fmadd=' | tee -a /tmp/x62fastpi/machine.txt; grep -Eic 'v(fmadd|fnmadd)' "$f" | tee -a /tmp/x62fastpi/machine.txt
            printf 'converts=' | tee -a /tmp/x62fastpi/machine.txt; grep -Eic 'vcvt.*pd.*dq|vcvt.*dq.*pd' "$f" | tee -a /tmp/x62fastpi/machine.txt
            printf 'permutes=' | tee -a /tmp/x62fastpi/machine.txt; grep -Eic 'vperm|vpermutex' "$f" | tee -a /tmp/x62fastpi/machine.txt
          done
          exit 0
      - name: Upload X62 campaign
        if: always() && steps.cpu.outputs.eligible == '1'
        uses: actions/upload-artifact@v4
        with:
          name: sine53-x62-fastpi-unique500k-${{ matrix.slot }}
          path: /tmp/x62fastpi
          if-no-files-found: ignore
