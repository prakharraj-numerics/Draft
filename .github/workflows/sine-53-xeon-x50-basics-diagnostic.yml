name: Sine 53-bit X50 Xeon basics diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ sine53-xeon-tuned-v2 ]
    paths:
      - '.github/workflows/sine-53-xeon-x50-basics-diagnostic.yml'

env:
  FLINT_PREFIX: /home/runner/flint36

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        slot: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Detect Intel Xeon AVX-512 host
        id: cpu
        shell: bash
        run: |
          MODEL="$(lscpu | awk -F: '/Model name/{gsub(/^[ \t]+/,"",$2); print $2; exit}')"
          lscpu | grep -E 'Vendor ID|Model name|CPU\(s\)|L2 cache|L3 cache'
          echo "detected_model=$MODEL"
          if [[ "$MODEL" == *"Intel"*"Xeon"* ]] && grep -m1 '^flags' /proc/cpuinfo | grep -qw avx512f; then
            echo eligible=1 >> "$GITHUB_OUTPUT"
          else
            echo eligible=0 >> "$GITHUB_OUTPUT"
            echo "SKIP: requires an Intel Xeon with AVX-512F"
          fi

      - name: Base packages
        if: steps.cpu.outputs.eligible == '1'
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential binutils curl ca-certificates gnupg libgmp-dev libmpfr-dev

      - name: Restore Intel oneAPI
        if: steps.cpu.outputs.eligible == '1'
        id: oneapi-cache
        uses: actions/cache@v4
        with:
          path: /opt/intel/oneapi
          key: intel-oneapi-prof3-intel-2026.1.0-236-2026.1.1-325-v1

      - name: Install Intel oneAPI on cache miss
        if: steps.cpu.outputs.eligible == '1' && steps.oneapi-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://apt.repos.intel.com/oneapi/intel-oneapi-archive-keyring.gpg | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends intel-oneapi-mkl-devel intel-oneapi-compiler-dpcpp-cpp

      - name: Restore FLINT 3.6.0
        if: steps.cpu.outputs.eligible == '1'
        id: flint-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/flint36
          key: flint-3.6.0-ubuntu24-x86_64-native-cd49f6116fb977da331dbb6627f4998397730a62253bd7a70a201ad5a00576d7-v2

      - name: Generate X50 and no-gather diagnostic path
        if: steps.cpu.outputs.eligible == '1'
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^int main(void){int cpu=pin();mkl_set_num_threads_local(1);printf("S53F2_DOMAIN/int s53f2_disabled_main(void){int cpu=pin();mkl_set_num_threads_local(1);printf("S53F2_DOMAIN/' bench_sine_53_wide_fast2.c
          sed -i 's/#define SF_K 12/#define SF_K 8/' sine_53_coeff_source.c
          sed -i 's/#define SF_LUT_N ((1UL << SF_K) + 1UL)/#define SF_LUT_N 403UL/' sine_53_coeff_source.c
          sed -i 's/#define KGRID 4096.0/#define KGRID 256.0/' bench_sine_53_wide_intel.c
          sed -i 's|#define INVK (1.0/4096.0)|#define INVK (1.0/256.0)|' bench_sine_53_wide_intel.c
          python3 make_sine_53_xeon_x50_x53_hw_campaign.py
          cp bench_sine_53_xeon_x50_build.c /tmp/x50_basics.c
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/x50_basics.c')
          s=p.read_text()
          pos=s.rfind('\nint main(void)')
          if pos < 0: raise SystemExit('main not found')
          extra=r'''
          OVEC __attribute__((noinline,hot,aligned(64))) static void x60_nogather_fixed_poly(
                  const s53w_kernel *k,const double * __restrict x,double * __restrict out,size_t n)
          {
              size_t i=0;
              const __m512d Z=_mm512_setzero_pd();
              const __m512d C3 =_mm512_set1_pd(-1.0/6.0);
              const __m512d C5 =_mm512_set1_pd( 1.0/120.0);
              const __m512d C7 =_mm512_set1_pd(-1.0/5040.0);
              const __m512d C9 =_mm512_set1_pd( 1.0/362880.0);
              const __m512d C11=_mm512_set1_pd(-1.0/39916800.0);
              const __m512d C13=_mm512_set1_pd( 1.0/6227020800.0);
              const __m512d C15=_mm512_set1_pd(-1.0/1307674368000.0);
              const __m512d C17=_mm512_set1_pd( 1.0/355687428096000.0);
              const __m512d C19=_mm512_set1_pd(-1.0/121645100408832000.0);
              const __m512d C21=_mm512_set1_pd( 1.0/51090942171709440000.0);
              for(;i+32<=n;i+=32){
                  for(int b=0;b<4;b++){
                      __m512d rh,rl; __mmask8 sg,gd,aa; unsigned char pu;
                      x12_prepare_block(x+i,8*b,32,&rh,&rl,&sg,&gd,&aa,&pu);
                      __m512d r=_mm512_add_pd(rh,rl), z=_mm512_mul_pd(r,r);
                      __m512d q=C21;
                      q=_mm512_fmadd_pd(q,z,C19); q=_mm512_fmadd_pd(q,z,C17);
                      q=_mm512_fmadd_pd(q,z,C15); q=_mm512_fmadd_pd(q,z,C13);
                      q=_mm512_fmadd_pd(q,z,C11); q=_mm512_fmadd_pd(q,z,C9);
                      q=_mm512_fmadd_pd(q,z,C7);  q=_mm512_fmadd_pd(q,z,C5);
                      q=_mm512_fmadd_pd(q,z,C3);
                      __m512d rz=_mm512_mul_pd(r,z);
                      __m512d y=_mm512_fmadd_pd(rz,q,r);
                      y=_mm512_mask_sub_pd(y,sg,Z,y);
                      _mm512_storeu_pd(out+i+8*b,y);
                      if(__builtin_expect(gd!=0,0)) for(unsigned lane=0;lane<8;lane++)
                          if(gd&(1u<<lane)) out[i+8*b+lane]=scalar2(k,x[i+8*b+lane]);
                  }
              }
              if(i<n) octant_vector_x20_tail(k,x+i,out+i,n-i);
          }

          static void make_exact(double*x,size_t n){
              for(size_t i=0;i<n;i++){
                  uint64_t h=mix64(UINT64_C(20260829223300)+(uint64_t)i*UINT64_C(0x9e3779b97f4a7c15));
                  double u=unit52(h),lo,hi; int b=(int)(i%3);
                  if(b==0){lo=0;hi=1;} else if(b==1){lo=1;hi=500;} else {lo=1000;hi=10000;}
                  double m=fma(hi-lo,u,lo); x[i]=(i&1)?-m:m;
              }
          }
          static double med7(double*a){qsort(a,7,sizeof(double),cmpd);return a[3];}
          static void bench_diag(const s53w_kernel*k,double*x,double*y,double*yn,double*yi,size_t n){
              enum{TR=7}; int rounds=(int)(24000000ULL/n); if(rounds<240)rounds=240;
              make_exact(x,n);
              for(int w=0;w<80;w++){octant_vector_v8(k,x,y,n);x60_nogather_fixed_poly(k,x,yn,n);vmdSin((MKL_INT)n,x,yi,VML_HA);}
              double tb[TR],tn[TR],ti[TR]; volatile double sink=0;
              for(int t=0;t<TR;t++){
                  uint64_t z=now_ns(); for(int r=0;r<rounds;r++)octant_vector_v8(k,x,y,n); tb[t]=(double)(now_ns()-z)/(rounds*(double)n);
                  z=now_ns(); for(int r=0;r<rounds;r++)x60_nogather_fixed_poly(k,x,yn,n); tn[t]=(double)(now_ns()-z)/(rounds*(double)n);
                  z=now_ns(); for(int r=0;r<rounds;r++)vmdSin((MKL_INT)n,x,yi,VML_HA); ti[t]=(double)(now_ns()-z)/(rounds*(double)n);
                  sink+=y[(17*t)%n]+yn[(19*t)%n]+yi[(23*t)%n];
              }
              double b=med7(tb),ng=med7(tn),iv=med7(ti),md=0.0;
              for(size_t j=0;j<n;j++){double d=fabs(yn[j]-yi[j]); if(d>md)md=d;}
              printf("BASICS_DIAG n=%zu x50_ns=%.9f nogather_ns=%.9f intel_ns=%.9f x50_over_intel=%.6f nogather_over_intel=%.6f x50_over_nogather=%.6f nogather_max_abs_vs_intel=%.17g sink=%.17g\n",n,b,ng,iv,b/iv,ng/iv,b/ng,md,(double)sink);
          }
          int main(void){
              int cpu=pin(); mkl_set_num_threads_local(1);
              printf("S53_X50_BASICS_DIAGNOSTIC cpu_pin=%d\n",cpu);
              if(!redtab2_init())return 2; s53w_kernel*k=kernel_create(2); if(!k)return 3;
              const size_t M=100000; double*x=al64(M*8),*y=al64(M*8),*yn=al64(M*8),*yi=al64(M*8); if(!x||!y||!yn||!yi)return 4;
              size_t ns[]={150,1200,9600,10000,100000}; for(size_t j=0;j<5;j++)bench_diag(k,x,y,yn,yi,ns[j]);
              free(yi);free(yn);free(y);free(x);kernel_destroy(k);redtab2_clear();flint_cleanup_master();return 0;
          }
          '''
          p.write_text(s[:pos]+extra)
          PY

      - name: Compile three target-policy variants, inspect spills, benchmark
        if: steps.cpu.outputs.eligible == '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/basicsdiag
          MODEL="$(lscpu | awk -F: '/Model name/{gsub(/^[ \t]+/,"",$2);print $2;exit}')"
          MKLROOT=/opt/intel/oneapi/mkl/latest
          CC=/opt/intel/oneapi/compiler/latest/bin/icx
          LIBS="-L$FLINT_PREFIX/lib -Wl,-rpath,$FLINT_PREFIX/lib -lflint -lmpfr -lgmp -L$MKLROOT/lib -Wl,-rpath,$MKLROOT/lib -Wl,--no-as-needed -lmkl_intel_lp64 -lmkl_sequential -lmkl_core -lpthread -lm -ldl"
          INC="-I$FLINT_PREFIX/include -I$MKLROOT/include -I."
          EXPLICIT="-march=x86-64-v4"
          case "$MODEL" in
            *8573C*) EXPLICIT="-march=emeraldrapids" ;;
            *848*|*847*|*846*|*845*|*844*|*843*|*842*|*841*) EXPLICIT="-march=sapphirerapids" ;;
            *8370C*|*836*|*835*|*834*|*833*|*832*|*831*) EXPLICIT="-march=icelake-server" ;;
            *82*|*62*) EXPLICIT="-march=cascadelake" ;;
            *81*|*61*) EXPLICIT="-march=skylake-avx512" ;;
          esac
          echo "CPU=$MODEL" | tee /tmp/basicsdiag/summary.txt
          "$CC" --version | head -1 | tee -a /tmp/basicsdiag/summary.txt
          echo "EXPLICIT_TARGET=$EXPLICIT" | tee -a /tmp/basicsdiag/summary.txt

          "$CC" -O3 -xHost -fp-model=precise -DNDEBUG $INC /tmp/x50_basics.c -o /tmp/basics_xhost $LIBS 2>&1 | tee /tmp/basicsdiag/compile_xhost.log
          "$CC" -O3 $EXPLICIT -fp-model=precise -DNDEBUG $INC /tmp/x50_basics.c -o /tmp/basics_explicit $LIBS 2>&1 | tee /tmp/basicsdiag/compile_explicit.log

          ZMMFLAGS="-xHost -qopt-zmm-usage=high"
          if ! "$CC" -O3 $ZMMFLAGS -fp-model=precise -DNDEBUG $INC /tmp/x50_basics.c -o /tmp/basics_zmm $LIBS > /tmp/basicsdiag/compile_zmm.log 2>&1; then
            echo "qopt-zmm-usage=high unsupported; falling back to -xHost -mprefer-vector-width=512" | tee -a /tmp/basicsdiag/summary.txt
            ZMMFLAGS="-xHost -mprefer-vector-width=512"
            "$CC" -O3 $ZMMFLAGS -fp-model=precise -DNDEBUG $INC /tmp/x50_basics.c -o /tmp/basics_zmm $LIBS 2>&1 | tee -a /tmp/basicsdiag/compile_zmm.log
          fi
          echo "ZMM_POLICY=$ZMMFLAGS" | tee -a /tmp/basicsdiag/summary.txt

          for v in xhost explicit zmm; do
            BIN=/tmp/basics_$v
            for fn in octant_vector_v8 x60_nogather_fixed_poly; do
              objdump -d -M intel --disassemble=$fn "$BIN" > "/tmp/basicsdiag/${v}_${fn}.asm" || true
              ASM="/tmp/basicsdiag/${v}_${fn}.asm"
              STACK=$(grep -Eic '\[(r|e)(sp|bp)([+\-][^]]+)?\]' "$ASM" || true)
              GATHER=$(grep -Eic 'vgather|vpgather' "$ASM" || true)
              FMA=$(grep -Eic 'vfmadd|vfnmadd|vfmsub|vfnmsub' "$ASM" || true)
              MASK=$(grep -Eic '\{k[1-7]\}' "$ASM" || true)
              echo "ASM_CENSUS variant=$v fn=$fn stack_refs=$STACK gathers=$GATHER fmas=$FMA masked_ops=$MASK" | tee -a /tmp/basicsdiag/summary.txt
            done
          done

          export LD_LIBRARY_PATH="$FLINT_PREFIX/lib:$MKLROOT/lib:${LD_LIBRARY_PATH:-}"
          for v in xhost explicit zmm; do
            echo "=== RUN variant=$v ===" | tee -a /tmp/basicsdiag/summary.txt
            stdbuf -oL -eL "/tmp/basics_$v" 2>&1 | tee "/tmp/basicsdiag/run_${v}.txt" | tee -a /tmp/basicsdiag/summary.txt
          done

      - name: Upload diagnostic
        if: always() && steps.cpu.outputs.eligible == '1'
        uses: actions/upload-artifact@v4
        with:
          name: sine53-x50-basics-diagnostic-${{ matrix.slot }}
          path: /tmp/basicsdiag
          if-no-files-found: ignore
