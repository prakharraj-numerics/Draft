name: Inspect Intel oneMKL VML sine binary

on:
  workflow_dispatch:
  push:
    branches: [ sine53-xeon-tuned-v2 ]
    paths:
      - '.github/workflows/sine-53-intel-vml-binary-research.yml'

env:
  FLINT_PREFIX: /home/runner/flint36

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        slot: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Require exact 6973P-C host
        id: cpu
        shell: bash
        run: |
          MODEL="$(lscpu | awk -F: '/Model name/{gsub(/^[ \t]+/,"",$2);print $2;exit}')"
          lscpu | grep -E 'Vendor ID|Model name|CPU\(s\)|L2 cache|L3 cache'
          echo "detected_model=$MODEL"
          if [[ "$MODEL" == *"6973P-C"* ]] && grep -m1 '^flags' /proc/cpuinfo | grep -qw avx512f; then echo eligible=1 >> "$GITHUB_OUTPUT"; else echo eligible=0 >> "$GITHUB_OUTPUT"; echo 'SKIP exact 6973P-C required'; fi
      - uses: actions/cache@v4
        if: steps.cpu.outputs.eligible == '1'
        with:
          path: /opt/intel/oneapi
          key: intel-oneapi-prof3-intel-2026.1.0-236-2026.1.1-325-v1
      - name: Install inspection tools
        if: steps.cpu.outputs.eligible == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils gdb
      - name: Inspect VML libraries and symbols
        if: steps.cpu.outputs.eligible == '1'
        shell: bash
        run: |
          set -euo pipefail
          MKLROOT=/opt/intel/oneapi/mkl/latest
          OUT=/tmp/intelvml; mkdir -p "$OUT"
          echo "CPU=$(lscpu | awk -F: '/Model name/{gsub(/^[ \t]+/,"",$2);print $2;exit}')" > "$OUT/summary.txt"
          echo "MKLROOT=$MKLROOT" >> "$OUT/summary.txt"
          find "$MKLROOT/lib" -maxdepth 2 -type f -name '*.so*' | sort > "$OUT/libs.txt"
          : > "$OUT/sin-symbols.txt"
          while IFS= read -r f; do
            nm -D --defined-only "$f" 2>/dev/null | grep -Ei '(^|[[:space:]_])(vmd?sin|vdSin|sin.*(ha|avx|512|vml)|.*vml.*sin)' | sed "s#^#$f :: #" >> "$OUT/sin-symbols.txt" || true
          done < "$OUT/libs.txt"
          grep -Ei 'vml|avx512|mkl_rt|core' "$OUT/libs.txt" > "$OUT/candidate-libs.txt" || true
          for f in $(cat "$OUT/candidate-libs.txt"); do
            strings "$f" 2>/dev/null | grep -Ei 'sin.*(avx512|ha|vml)|vmdsin|vdsin' | head -n 400 | sed "s#^#$f :: #" >> "$OUT/sin-strings.txt" || true
          done
      - name: Resolve vmdSin runtime owner
        if: steps.cpu.outputs.eligible == '1'
        shell: bash
        run: |
          set -euo pipefail
          MKLROOT=/opt/intel/oneapi/mkl/latest
          OUT=/tmp/intelvml
          cat > /tmp/resolve_vml.c <<'EOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <dlfcn.h>
          #include <mkl.h>
          int main(){
            void *p=dlsym(RTLD_DEFAULT,"vmdSin"); Dl_info i={0};
            printf("dlsym_vmdSin=%p\n",p);
            if(p && dladdr(p,&i)) printf("owner=%s symbol=%s saddr=%p\n",i.dli_fname,i.dli_sname?i.dli_sname:"?",i.dli_saddr);
            double x[8]={1.1,2.2,3.3,4.4,100,499,1000,9999}, y[8];
            vmdSin(8,x,y,VML_HA); printf("sink=%.17g\n",y[7]);
            return 0;
          }
          EOF
          /opt/intel/oneapi/compiler/latest/bin/icx -O2 -I"$MKLROOT/include" /tmp/resolve_vml.c -o /tmp/resolve_vml -L"$MKLROOT/lib" -Wl,-rpath,"$MKLROOT/lib" -Wl,--no-as-needed -lmkl_intel_lp64 -lmkl_sequential -lmkl_core -ldl -lpthread -lm
          LD_LIBRARY_PATH="$MKLROOT/lib:${LD_LIBRARY_PATH:-}" /tmp/resolve_vml | tee "$OUT/runtime-owner.txt"
          LD_DEBUG=libs,bindings LD_LIBRARY_PATH="$MKLROOT/lib:${LD_LIBRARY_PATH:-}" /tmp/resolve_vml > "$OUT/lddebug.out" 2> "$OUT/lddebug.err" || true
          grep -Ei 'vmdSin|vdsin|vml|mkl' "$OUT/lddebug.err" | tail -n 500 > "$OUT/lddebug-filtered.txt" || true
      - name: Disassemble exported sine candidates
        if: steps.cpu.outputs.eligible == '1'
        shell: bash
        run: |
          set +e
          OUT=/tmp/intelvml
          : > "$OUT/disassembly.txt"
          awk -F' :: ' '{print $1}' "$OUT/sin-symbols.txt" | sort -u | while read -r f; do
            echo "===== $f =====" >> "$OUT/disassembly.txt"
            nm -D --defined-only "$f" 2>/dev/null | awk '{print $3}' | grep -Ei 'vmd?sin|vdsin|sin.*(ha|avx|512|vml)|vml.*sin' | head -n 80 | while read -r s; do
              echo "--- SYMBOL $s ---" >> "$OUT/disassembly.txt"
              objdump -drwC -Mintel --disassemble="$s" "$f" 2>/dev/null | head -n 500 >> "$OUT/disassembly.txt"
            done
          done
          grep -Ei 'vfmadd|vfnmadd|vsubpd|vmulpd|vpsllq|vcvt|vrnd|round|gather|perm|cmp|test|jmp|call' "$OUT/disassembly.txt" > "$OUT/disassembly-keyinsn.txt" || true
          exit 0
      - name: Upload research artifact
        if: always() && steps.cpu.outputs.eligible == '1'
        uses: actions/upload-artifact@v4
        with:
          name: intel-vml-sin-binary-${{ matrix.slot }}
          path: /tmp/intelvml
          if-no-files-found: ignore
