name: Sine53 freeze exact X68 production sources
on:
  workflow_dispatch:
  push:
    branches: [sine53-xeon-tuned-v2]
    paths: ['.github/workflows/sine-53-freeze-extract-production-sources.yml']
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install generator dependency
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-mpmath
      - name: Generate exact X68 X50 + X67 sources
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^int main(void){int cpu=pin();mkl_set_num_threads_local(1);printf("S53F2_DOMAIN/int s53f2_disabled_main(void){int cpu=pin();mkl_set_num_threads_local(1);printf("S53F2_DOMAIN/' bench_sine_53_wide_fast2.c
          sed -i 's/#define SF_K 12/#define SF_K 8/' sine_53_coeff_source.c
          sed -i 's/#define SF_LUT_N ((1UL << SF_K) + 1UL)/#define SF_LUT_N 403UL/' sine_53_coeff_source.c
          sed -i 's/#define KGRID 4096.0/#define KGRID 256.0/' bench_sine_53_wide_intel.c
          sed -i 's|#define INVK (1.0/4096.0)|#define INVK (1.0/256.0)|' bench_sine_53_wide_intel.c
          mkdir -p /tmp/frozen-src
          python3 make_sine_53_xeon_x50_x53_hw_campaign.py
          cp bench_sine_53_xeon_x50_build.c /tmp/frozen-src/sine53_x50_unit_production.c
          python3 make_sine_53_x67_compensated_grouped_final.py
          cp bench_sine_53_xeon_x67_build.c /tmp/frozen-src/sine53_x67_wide_production.c
          sha256sum /tmp/frozen-src/*.c | tee /tmp/frozen-src/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sine53-frozen-x68-production-sources
          path: /tmp/frozen-src
          if-no-files-found: error
