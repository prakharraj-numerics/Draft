name: SINE53 hardened release build v5

on:
  workflow_dispatch:
  push:
    branches: [ release/sine53-binary-20260913 ]
    paths:
      - '.github/workflows/sine53-hardened-build-v5.yml'
      - 'release/build_s53_hostindependent_v5.sh'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FLINT_PREFIX: /home/runner/flint36
      SOURCE_DATE_EPOCH: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install prerequisites
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential binutils file libgmp-dev libmpfr-dev python3 curl xz-utils gpg-agent wget ca-certificates
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null
          sudo apt-get update -qq

      - name: Restore Intel oneAPI
        id: oneapi
        uses: actions/cache@v4
        with:
          path: /opt/intel/oneapi
          key: sine53-oneapi-compiler-mkl-ipp-svml-2026.1-v1

      - name: Install Intel oneAPI on cache miss
        if: steps.oneapi.outputs.cache-hit != 'true'
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: sudo apt-get install -y --no-install-recommends intel-oneapi-mkl-devel intel-oneapi-compiler-dpcpp-cpp intel-oneapi-ipp-devel

      - name: Restore generic FLINT 3.6.0
        id: flint
        uses: actions/cache@v4
        with:
          path: /home/runner/flint36
          key: flint-3.6.0-ubuntu24-x86_64-generic-v2

      - name: Install generic FLINT on cache miss
        if: steps.flint.outputs.cache-hit != 'true'
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          curl -L --fail --retry 3 -o /tmp/flint.tar.xz https://github.com/flintlib/flint/releases/download/v3.6.0/flint-3.6.0.tar.xz
          echo '134d39731a6dd926254625d646d85bf5990c68a3f2326cd54d2a6983e3e11dd8  /tmp/flint.tar.xz' | sha256sum -c -
          tar -xf /tmp/flint.tar.xz -C /tmp
          cd /tmp/flint-3.6.0
          CFLAGS='-O2 -march=x86-64-v2 -DNDEBUG' ./configure --prefix="$FLINT_PREFIX"
          make -j2 >/dev/null
          make install >/dev/null

      - name: Build hardened release
        id: build
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          bash release/build_s53_hostindependent_v5.sh
          rc=$?
          echo "$rc" > /tmp/s53-build.rc
          echo "BUILD_RC=$rc"
          echo '--- BUILD LOG TAIL ---'
          tail -n 250 /tmp/s53-build.log || true
          exit "$rc"

      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sine53-v5-diagnostics
          path: |
            /tmp/s53-build.log
            /tmp/s53-build.rc
            /tmp/s53release
          if-no-files-found: warn
          retention-days: 30

      - name: Upload hardened release
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sine53-hardened-clean-linux-x86_64-graniterapids-v5
          path: |
            /tmp/s53release/libs53.so
            /tmp/s53release/s53.h
            /tmp/s53release/USAGE.txt
            /tmp/s53release/SHA256.txt
            /tmp/s53release/source-build-hashes.txt
            /tmp/s53release/audit.txt
          if-no-files-found: error
          retention-days: 30
