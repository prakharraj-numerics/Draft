name: Apple SINE53 original EARTH speed+efficiency

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-sine53-EARTH-original-efficiency.yml'

permissions:
  contents: read

jobs:
  bench:
    runs-on: nscloud-macos-tahoe-arm64-6x14
    timeout-minutes: 20
    env:
      VECLIB_MAXIMUM_THREADS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Verify Namespace Apple M4+ SME hardware
        shell: bash
        run: |
          set -euo pipefail
          chip="$(sysctl -n machdep.cpu.brand_string)"
          gen="$(printf '%s\n' "$chip" | sed -nE 's/.*Apple M([0-9]+).*/\1/p')"
          echo "chip=$chip"
          echo "APPLE_M_GENERATION=$gen"
          echo "SME=$(sysctl -n hw.optional.arm.FEAT_SME)"
          echo "SME2=$(sysctl -n hw.optional.arm.FEAT_SME2)"
          echo "SVL_BYTES=$(sysctl -n hw.optional.arm.sme_max_svl_b)"
          test -n "$gen" && test "$gen" -ge 4
          test "$(sysctl -n hw.optional.arm.FEAT_SME)" = 1
          test "$(sysctl -n hw.optional.arm.FEAT_SME2)" = 1
          test "$(sysctl -n hw.optional.arm.sme_max_svl_b)" = 64

      - name: Build exact SINE53 EARTH hot kernel benchmark
        shell: bash
        run: |
          set -euo pipefail
          cp benchmark_support/apple_sine53_earth_frozen.cpp /tmp/sine_earth.cpp
          cat >/tmp/sine_earth_entry.s <<'ASM'
          .text
          .globl _sine53_earth_raw
          .p2align 2
          _sine53_earth_raw:
              stp x29, x30, [sp, #-16]!
              mov x29, sp
              smstart sm
              bl _sine53_earth_stream
              smstop sm
              ldp x29, x30, [sp], #16
              ret
          ASM
          cat >/tmp/sine_earth_eff.cpp <<'CPP'
          #include <Accelerate/Accelerate.h>
          #include <mach/mach_time.h>
          #include <sys/resource.h>
          #include <algorithm>
          #include <cmath>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <vector>

          static volatile double sink=0.0;
          extern "C" void sine53_earth_raw(const double*,double*,size_t,const double*,const double*,const double*,const uint64_t*);
          static uint64_t mix64(uint64_t x){x^=x>>30;x*=UINT64_C(0xbf58476d1ce4e5b9);x^=x>>27;x*=UINT64_C(0x94d049bb133111eb);x^=x>>31;return x;}
          static double unit52(uint64_t h){return ((double)(h>>12)+0.5)*0x1p-52;}
          static double wall_ns(uint64_t t){static mach_timebase_info_data_t tb=[](){mach_timebase_info_data_t x{};mach_timebase_info(&x);return x;}();return (double)t*tb.numer/tb.denom;}
          static double tv_ns(const timeval& t){return (double)t.tv_sec*1e9+(double)t.tv_usec*1e3;}
          static double cpu_now_ns(){rusage r{};getrusage(RUSAGE_SELF,&r);return tv_ns(r.ru_utime)+tv_ns(r.ru_stime);}

          struct P{std::vector<double>x,d,c0,c1,y,apple;std::vector<uint64_t>s;};
          static P prep(size_t n){
            P z;z.x.resize(n);z.d.resize(n);z.c0.resize(n);z.c1.resize(n);z.y.resize(n);z.apple.resize(n);z.s.resize(n);
            for(size_t i=0;i<n;i++){
              double u=unit52(mix64(UINT64_C(202609071700)+i*UINT64_C(0x9e3779b97f4a7c15)));
              double mag=10000.0*u;
              z.x[i]=(i&1)?-mag:mag;
              z.d[i]=(unit52(mix64(i+11))-0.5)*0x1p-10;
              // Precomputed-stream benchmark only. Build a valid cosine-EARTH anchor pair
              // outside the timed region: c0=cos(a), c1=-sin(a). The sine EARTH kernel
              // remaps these lane-wise to sin(a),cos(a); no trig call occurs in EARTH timing.
              double a=unit52(mix64(i+23))*1.57;
              z.c0[i]=std::cos(a);
              z.c1[i]=-std::sin(a);
              z.s[i]=(uint64_t)((i>>1)&1u);
            }
            return z;
          }
          static void earth(P&z){sine53_earth_raw(z.x.data(),z.y.data(),z.x.size(),z.d.data(),z.c0.data(),z.c1.data(),z.s.data());}
          static void apple(P&z){int n=(int)z.x.size();vvsin(z.apple.data(),z.x.data(),&n);}
          using F=void(*)(P&);
          struct M{double wall,cpu;};
          static M bench(F f,P&z){
            for(int i=0;i<30;i++)f(z);
            size_t r=std::max<size_t>(4,12000000/z.x.size());
            double c0=cpu_now_ns();uint64_t t0=mach_absolute_time();
            for(size_t i=0;i<r;i++)f(z);
            uint64_t t1=mach_absolute_time();double c1=cpu_now_ns();
            sink+=z.y[z.x.size()/3];
            double den=(double)(r*z.x.size());
            return {wall_ns(t1-t0)/den,(c1-c0)/den};
          }
          static double med5(double x[5]){std::sort(x,x+5);return x[2];}
          int main(){
            size_t sizes[]={100,400,1000,4000,10000,15000,29999,30000,50000,175000,100000,500000,1000000};
            for(size_t n:sizes){
              P z=prep(n);double ew[5],ec[5],aw[5],ac[5];
              for(int k=0;k<5;k++){
                M e=bench(earth,z),a=bench(apple,z);
                ew[k]=e.wall;ec[k]=e.cpu;aw[k]=a.wall;ac[k]=a.cpu;
              }
              double E=med5(ew),EC=med5(ec),A=med5(aw),AC=med5(ac);
              std::printf("SINE_EARTH_EFF n=%zu earth_wall_ns_el=%.9f earth_cpu_ns_el=%.9f earth_effective_cores=%.6f vvsin_wall_ns_el=%.9f vvsin_cpu_ns_el=%.9f vvsin_effective_cores=%.6f speedup_vs_vvsin=%.6f cpu_eff_ratio_vvsin_over_earth=%.6f\n",n,E,EC,EC/E,A,AC,AC/A,A/E,AC/EC);
            }
            return sink==123456.0;
          }
          CPP
          COMMON="-O3 -DNDEBUG -std=c++20 -march=armv9.2-a+sme+sme2 -fno-fast-math -ffp-contract=fast -fno-vectorize -fno-slp-vectorize"
          clang++ $COMMON -c /tmp/sine_earth.cpp -o /tmp/earth.o
          clang -c -march=armv9.2-a+sme+sme2 /tmp/sine_earth_entry.s -o /tmp/entry.o
          clang++ -O3 -DNDEBUG -std=c++20 /tmp/sine_earth_eff.cpp /tmp/earth.o /tmp/entry.o -framework Accelerate -o /tmp/sine_earth_eff

      - name: Benchmark speed and CPU efficiency
        shell: bash
        run: |
          set -euo pipefail
          /tmp/sine_earth_eff | tee /tmp/results.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sine53-earth-original-efficiency
          path: /tmp/results.txt
