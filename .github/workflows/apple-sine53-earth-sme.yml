name: Apple SINE53 EARTH SME

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-sine53-earth-sme.yml'
      - 'benchmark_support/apple_sine53_earth_frozen.cpp'
      - 'benchmark_support/apple_sine53_earth_prepare.hpp'
      - 'benchmark_support/apple_sine53_earth_benchmark.cpp'

permissions:
  contents: read
  actions: read

jobs:
  validate-bench:
    runs-on: nscloud-macos-tahoe-arm64-6x14
    timeout-minutes: 30
    env:
      VECLIB_MAXIMUM_THREADS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Verify Namespace M4+ SME hardware
        shell: bash
        run: |
          set -euo pipefail
          chip="$(sysctl -n machdep.cpu.brand_string)"
          echo "chip=$chip"
          gen="$(printf '%s\n' "$chip" | sed -nE 's/.*Apple M([0-9]+).*/\1/p')"
          test -n "$gen"
          test "$gen" -ge 4
          echo "APPLE_M_GENERATION=$gen"
          echo "SME=$(sysctl -n hw.optional.arm.FEAT_SME)"
          echo "SME2=$(sysctl -n hw.optional.arm.FEAT_SME2)"
          echo "SVL_BYTES=$(sysctl -n hw.optional.arm.sme_max_svl_b)"
          test "$(sysctl -n hw.optional.arm.FEAT_SME)" = 1
          test "$(sysctl -n hw.optional.arm.FEAT_SME2)" = 1
          test "$(sysctl -n hw.optional.arm.sme_max_svl_b)" = 64

      - name: Install MPFR validation dependency
        shell: bash
        run: |
          set -euo pipefail
          brew list mpfr >/dev/null 2>&1 || brew install mpfr

      - name: Fetch exact frozen COS53 PLUTO K1280 coefficient table
        uses: actions/download-artifact@v4
        with:
          name: pluto-m4-generated-source
          path: /tmp/pluto-art
          github-token: ${{ github.token }}
          repository: prakharraj-numerics/Draft-cosine
          run-id: '34051479551'

      - name: Verify frozen PLUTO table contract
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/pluto-art/apple_cos53_coeff_aos.h
          grep -q 'OPT_COS53_LUTN' /tmp/pluto-art/apple_cos53_coeff_aos.h
          grep -q 'opt_cos53_coeff_aos' /tmp/pluto-art/apple_cos53_coeff_aos.h

      - name: Build literal sine EARTH transfer
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/sine53_earth_entry.s <<'ASM'
          .text
          .globl _sine53_earth_raw
          .p2align 2
          _sine53_earth_raw:
              stp x29, x30, [sp, #-16]!
              mov x29, sp
              smstart sm
              bl _sine53_earth_stream
              smstop sm
              ldp x29, x30, [sp], #16
              ret
          ASM
          COMMON="-O3 -DNDEBUG -std=c++20 -march=armv9.2-a+sme+sme2 -fno-fast-math -ffp-contract=fast -fno-vectorize -fno-slp-vectorize"
          clang++ $COMMON -c benchmark_support/apple_sine53_earth_frozen.cpp -o /tmp/earth.o
          clang -c -march=armv9.2-a+sme+sme2 /tmp/sine53_earth_entry.s -o /tmp/entry.o
          MPFR="$(brew --prefix mpfr)"; GMP="$(brew --prefix gmp)"
          clang++ -O3 -DNDEBUG -std=c++20 -Ibenchmark_support -I/tmp/pluto-art -I"$MPFR/include" -I"$GMP/include" benchmark_support/apple_sine53_earth_benchmark.cpp /tmp/earth.o /tmp/entry.o -L"$MPFR/lib" -L"$GMP/lib" -lmpfr -lgmp -framework Accelerate -o /tmp/sine53_earth_bench

      - name: Validate against MPFR256 and Apple vvsin
        shell: bash
        run: |
          set -euo pipefail
          /tmp/sine53_earth_bench validate | tee /tmp/validate.txt

      - name: Benchmark SME hot stage full path and vvsin
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/bench.txt
          for n in 100 400 1000 3000 6000 15000 30000 80000 200000 500000 1000000; do
            /tmp/sine53_earth_bench bench "$n" | tee -a /tmp/bench.txt
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-sine53-earth-sme
          path: |
            /tmp/validate.txt
            /tmp/bench.txt
