name: Sine53 one-shot root production cleanup
on:
  push:
    branches: [sine53-xeon-tuned-v2]
    paths: ['.github/workflows/sine-53-cleanup-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze production pair and remove root experimental sine53 code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "BACKUP_BRANCH=sine53-x69-frozen-9600"
          echo "FREEZE_RUN=33301031553"
          rm -rf /tmp/frozen && mkdir -p /tmp/frozen
          gh run download 33301031553 -R "$GITHUB_REPOSITORY" -n sine53-frozen-x68-production-sources -D /tmp/frozen
          test "$(sha256sum /tmp/frozen/sine53_x50_unit_production.c | awk '{print $1}')" = "ba79230dc0154f198129b21eb87fd0f96de0457e0a7f08f6e78ec2d29dd1806c"
          test "$(sha256sum /tmp/frozen/sine53_x67_wide_production.c | awk '{print $1}')" = "586fcc695a06a855ab0c59a8bc791618685d4fcbabdf459b56ccd6c0b9190c5c"
          cp /tmp/frozen/sine53_x50_unit_production.c ./sine53_x50_unit_production.c
          cp /tmp/frozen/sine53_x67_wide_production.c ./sine53_x67_wide_production.c
          test -f inject_sine53_x50_unit3200.py
          test -f inject_sine53_x67_final_bands.py
          cp inject_sine53_x50_unit3200.py sine53_production_inject_unit3200.py
          cp inject_sine53_x67_final_bands.py sine53_production_inject_wide3200.py
          keep_re='^(sine53_x50_unit_production\.c|sine53_x67_wide_production\.c|sine53_production_inject_unit3200\.py|sine53_production_inject_wide3200\.py|bench_sine_53_wide_fast2\.c|bench_sine_53_wide_intel\.c|sine_53_coeff_source\.c)$'
          deleted=0
          while IFS= read -r -d '' f; do
            b="${f#./}"
            if [[ ! "$b" =~ $keep_re ]]; then
              echo "DELETE_ROOT $b"
              rm -f -- "$f"
              deleted=$((deleted+1))
            fi
          done < <(find . -maxdepth 1 -type f \( -iname '*sine_53*' -o -iname '*sine53*' -o -iname '*s53*' \) -print0)
          echo "DELETED_ROOT=$deleted"
          echo 'REMAINING_SINE53_ROOT:'
          find . -maxdepth 1 -type f \( -iname '*sine_53*' -o -iname '*sine53*' -o -iname '*s53*' \) -printf '%f\n' | sort
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit -m 'Clean sine53 root to frozen X50+X67 production'
          git push origin HEAD:sine53-xeon-tuned-v2
